name: varna
description: Varna - card-based notes that sync to your own Google Drive or iCloud.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management and routing
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.2

  # Core
  intl: ^0.20.3
  uuid: ^4.6.0
  http: ^1.6.0

  # Storage (sembast_web is only imported from web-side files)
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  path_provider: ^2.1.6

  # Sync providers
  google_sign_in: ^6.3.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  googleapis: ^17.0.0
  icloud_storage: ^2.2.0

  # Mobile-only services (only imported from io-side files)
  google_mlkit_text_recognition: ^0.17.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Used by the UI layer
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  local_auth: ^3.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled; never downloaded at runtime. All three are SIL OFL.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Noto Sans Telugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
