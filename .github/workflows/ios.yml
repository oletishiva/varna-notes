name: iOS build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build iOS (no code signing)
        id: ios
        continue-on-error: true
        run: flutter build ios --no-codesign --debug 2>&1 | tee build_ios.log
      - name: Publish log to ci-logs-ios branch
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p /tmp/pub
          { echo "commit: ${GITHUB_SHA}"; echo "build_ios: ${{ steps.ios.outcome }}"; } > /tmp/pub/RESULT.txt
          if [ -f build_ios.log ]; then
            tail -n 500 build_ios.log | sed $'s/\x1b\\[[0-9;]*[A-Za-z]//g' > /tmp/pub/build_ios.log
          fi
          cd /tmp/pub
          git init -q -b ci-logs-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "iOS CI log for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs-ios
      - name: Fail if the iOS build failed
        if: always()
        run: test "${{ steps.ios.outcome }}" = "success"
