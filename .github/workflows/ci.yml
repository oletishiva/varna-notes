name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ]; then
            flutter create --platforms=android,ios,web --org com.qavedik --project-name varna .
          fi

      - name: Get packages
        run: flutter pub get 2>&1 | tee pub_get.log

      # Each step records its real exit code so one failure does not hide the others.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        continue-on-error: true
        run: flutter test 2>&1 | tee test.log

      - name: Build web
        id: web
        continue-on-error: true
        run: flutter build web 2>&1 | tee build_web.log

      # The authoring environment cannot download Actions artifacts, so the
      # logs are also pushed to a plain branch that can be read through git.
      - name: Publish logs to ci-logs branch
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p /tmp/pub
          {
            echo "commit: ${GITHUB_SHA}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "build_web: ${{ steps.web.outcome }}"
          } > /tmp/pub/RESULT.txt
          for f in pub_get analyze test build_web; do
            if [ -f "$f.log" ]; then
              tail -n 500 "$f.log" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' > "/tmp/pub/$f.log"
            fi
          done
          cd /tmp/pub
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-logs

      - name: Fail if anything failed
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = "success" && \
          test "${{ steps.test.outcome }}" = "success" && \
          test "${{ steps.web.outcome }}" = "success"
